<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#CFEBB3">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="טריוויה">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>הטריוויה הגדולה</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Secular+One&display=swap">
<style>
/* Layout: one centered column — trail to 100 on top, then either the topic picker or a question card with a 2×2 answer grid. Single sunny theme, chosen on purpose. */
:root {
  --leaf: #CFEBB3;
  --leaf-deep: #A9D98A;
  --jungle: #1F3D1A;
  --bark: #6B4A2B;
  --sun: #FFC93C;
  --sun-deep: #F2A900;
  --paper: #FFFDF5;
  --good: #149463;
  --good-soft: #D3F5E3;
  --bad: #E2502F;
  --bad-soft: #FFE0D6;
  --muted: #55704A;
  --display: "Secular One", "Fredoka", "Arial Hebrew", Arial, sans-serif;
  --body: "Fredoka", "Arial Hebrew", Arial, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--leaf);
  background-image:
    radial-gradient(circle at 12% 8%, rgba(255,201,60,.35) 0 90px, transparent 91px),
    radial-gradient(circle at 90% 95%, var(--leaf-deep) 0 160px, transparent 161px);
  background-attachment: fixed;
  color: var(--jungle);
  font-family: var(--body);
  font-size: 18px;
}
.wrap {
  max-width: 620px;
  margin: 0 auto;
  padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 6vw, 34px); margin: 0; line-height: 1.1; text-wrap: balance; }
.score {
  font-family: var(--display); font-size: 30px; background: var(--sun); border: 3px solid var(--jungle);
  border-radius: 999px; padding: 4px 18px; min-width: 96px; text-align: center;
  font-variant-numeric: tabular-nums; box-shadow: 0 4px 0 var(--jungle);
  transition: transform .2s;
}
.score.bump { transform: scale(1.18); }
.score small { font-family: var(--body); font-size: 14px; font-weight: 600; }

/* trail */
.trail { position: relative; height: 56px; }
.track {
  position: absolute; inset: 22px 0 auto 0; height: 14px; border-radius: 999px;
  background: repeating-linear-gradient(90deg, var(--bark) 0 10px, #85603C 10px 20px);
  opacity: .35;
}
.fill {
  position: absolute; top: 22px; right: 0; height: 14px; border-radius: 999px;
  background: var(--good); width: 0%; transition: width .5s cubic-bezier(.3,1.4,.5,1);
}
.runner, .goal { position: absolute; top: 0; font-size: 38px; line-height: 1; }
.runner { right: 0; transition: right .5s cubic-bezier(.3,1.4,.5,1); }
.goal { left: -4px; }
.trail-label { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); font-weight: 600; margin-top: -4px; }

/* card */
.card {
  background: var(--paper); border: 3px solid var(--jungle); border-radius: 26px;
  box-shadow: 0 7px 0 var(--jungle); padding: 22px 18px 24px;
  display: flex; flex-direction: column; gap: 18px;
}
.q-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 15px; font-weight: 600; flex-wrap: wrap; }
.q-tools { display: flex; gap: 8px; flex-basis: 100%; }
#menu { margin-inline-start: auto; }
.chip {
  font: inherit; font-size: 15px; background: var(--leaf); color: var(--jungle);
  border: 2px solid var(--jungle); border-radius: 999px; padding: 6px 12px; cursor: pointer;
}
.topic-tag { font-weight: 700; color: var(--jungle); }
.timer {
  font-weight: 700; font-size: 16px; color: var(--jungle); background: #FFF1C2; border: 2px solid var(--jungle);
  border-radius: 999px; padding: 3px 12px; font-variant-numeric: tabular-nums; min-width: 64px; text-align: center;
}
.timer.stopped { background: var(--leaf); }
.big-emoji { font-size: 84px; text-align: center; line-height: 1; animation: pop .45s ease-out; }
.count-row { display: block; white-space: nowrap; overflow-x: auto; font-size: .95em; letter-spacing: 2px; margin-top: 6px; }
.question { font-family: var(--display); font-weight: 400; font-size: clamp(23px, 5.4vw, 30px); text-align: center; margin: 0; line-height: 1.3; text-wrap: balance; }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ans {
  font: inherit; font-size: 21px; font-weight: 600; color: var(--jungle); line-height: 1.25;
  background: #fff; border: 3px solid var(--jungle); border-radius: 18px;
  box-shadow: 0 5px 0 var(--jungle); padding: 14px 10px; cursor: pointer; min-width: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center;
  transition: transform .08s, box-shadow .08s, background .2s;
}
.ans .e { font-size: 42px; line-height: 1; }
.ans .t { overflow-wrap: anywhere; }
.ans.num .n { font-family: var(--display); font-size: 56px; line-height: 1; font-variant-numeric: tabular-nums; }
.ans:hover:not(:disabled) { background: #FFF6D6; }
.ans:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--jungle); }
.ans:focus-visible, .chip:focus-visible, .btn:focus-visible, .topic:focus-visible { outline: 4px solid var(--sun-deep); outline-offset: 3px; }
.ans:disabled { cursor: default; }
.ans.right { background: var(--good-soft); border-color: var(--good); box-shadow: 0 5px 0 var(--good); animation: wiggle .5s; }
.ans.wrong { background: var(--bad-soft); border-color: var(--bad); box-shadow: 0 5px 0 var(--bad); animation: shake .4s; }
.ans.dim { opacity: .45; }

.feedback {
  border-radius: 18px; padding: 14px 16px; font-size: 21px; font-weight: 600; text-align: center;
  display: flex; flex-direction: column; gap: 12px; align-items: center;
}
.feedback.good { background: var(--good-soft); color: var(--good); }
.feedback.bad { background: var(--bad-soft); color: var(--bad); }
.fact { display: block; width: 100%; background: var(--paper); color: var(--jungle); border-radius: 12px; padding: 8px 12px; font-size: 17px; font-weight: 500; line-height: 1.4; text-align: center; text-wrap: pretty; }
.fact b { color: var(--bark); font-weight: 700; }
.feedback .pts { font-family: var(--display); font-size: 28px; }
.btn {
  font-family: var(--display); font-size: 24px; color: var(--jungle); background: var(--sun);
  border: 3px solid var(--jungle); border-radius: 999px; box-shadow: 0 5px 0 var(--jungle);
  padding: 8px 30px; cursor: pointer;
}
.btn.alt { background: #fff; }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--jungle); }

/* topic picker */
.pick-title { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 6vw, 32px); text-align: center; margin: 0; }
.pick-sub { text-align: center; margin: -8px 0 0; color: var(--muted); font-weight: 500; }
.topics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.topic {
  font: inherit; color: var(--jungle); background: #fff; border: 3px solid var(--jungle); border-radius: 20px;
  box-shadow: 0 5px 0 var(--jungle); padding: 14px 8px 12px; cursor: pointer; min-width: 0;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  transition: transform .08s, box-shadow .08s, background .2s;
}
.topic:hover { background: #FFF6D6; }
.topic:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--jungle); }
.topic .ti { font-size: 50px; line-height: 1.05; }
.topic .tn { font-family: var(--display); font-size: 22px; line-height: 1.2; }
.topic .tc { font-size: 14px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.topic.all { grid-column: 1 / -1; background: var(--sun); flex-direction: row; justify-content: center; gap: 12px; }
.topic.all .ti { font-size: 40px; }
.topic.all:hover { background: #FFD666; }

/* win */
.win { text-align: center; align-items: center; }
.win h2 { font-family: var(--display); font-weight: 400; font-size: 38px; margin: 0; }
.win p { margin: 0; font-size: 20px; line-height: 1.5; }
.trophy { font-size: 110px; line-height: 1; animation: pop .6s ease-out; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 440px; }
.stat.time { display: flex; flex-direction: column; gap: 2px; background: #FFF1C2; }
.stat .sl { font-size: 15px; }
.stat.time b { font-size: 22px; }
.stat .sq { font-size: 13px; font-weight: 500; color: var(--muted); line-height: 1.3; text-wrap: balance; }
.stat { background: var(--leaf); border-radius: 14px; padding: 8px 16px; font-weight: 600; }
.stat b { font-family: var(--display); font-weight: 400; font-size: 26px; display: block; font-variant-numeric: tabular-nums; }
.repeat-opt { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.repeat-opt label { display: inline-flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
.repeat-opt input { width: 22px; height: 22px; accent-color: var(--good); margin: 0; cursor: pointer; }
.seen-info { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.link-btn { font: inherit; color: var(--jungle); background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; }
.link-btn:focus-visible, .repeat-opt input:focus-visible { outline: 3px solid var(--sun-deep); outline-offset: 2px; }
.records { width: 100%; max-width: 440px; box-sizing: border-box; border: 3px dashed var(--sun-deep); border-radius: 16px; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; background: #FFFBEA; }
.rec-title { font-weight: 700; font-size: 16px; }
.rec-row { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; font-size: 16px; }
.rec-row b { font-family: var(--display); font-weight: 400; font-size: 20px; font-variant-numeric: tabular-nums; }
.new-rec { background: var(--bad); color: #fff; font-weight: 700; font-size: 13px; border-radius: 999px; padding: 2px 10px; animation: pop .5s ease-out; }
.rec-first { font-size: 13px; color: var(--muted); }
.win-btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 5; }

@keyframes pop { 0% { transform: scale(.4); opacity: 0 } 70% { transform: scale(1.12) } 100% { transform: scale(1); opacity: 1 } }
@keyframes shake { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-8px) } 75% { transform: translateX(8px) } }
@keyframes wiggle { 0%,100% { transform: rotate(0) } 30% { transform: rotate(-2deg) scale(1.03) } 70% { transform: rotate(2deg) scale(1.03) } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

/* phones: the whole game fits exactly one screen — sizes follow the screen height, nothing scrolls */
@media (max-width: 700px) {
  body { background-attachment: scroll; }
  .wrap {
    box-sizing: border-box;
    height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    padding-block: 10px 14px; gap: 8px;
  }
  header { flex-shrink: 0; }
  h1 { font-size: clamp(20px, 3.2dvh, 28px); }
  .score { font-size: clamp(20px, 3.2dvh, 28px); padding: 2px 14px; min-width: 70px; box-shadow: 0 3px 0 var(--jungle); }
  .score small { font-size: 12px; }
  .trail { height: 40px; }
  .track, .fill { top: 16px; height: 10px; }
  .runner, .goal { font-size: 30px; }
  .trail-label { font-size: 12px; margin-top: -2px; }

  .card { flex: 1; min-height: 0; overflow: auto; padding: 12px 12px 14px; gap: clamp(8px, 1.4dvh, 14px); border-radius: 22px; box-shadow: 0 5px 0 var(--jungle); }
  .q-top { font-size: 13px; gap: 6px; flex-shrink: 0; }
  .chip { font-size: 13px; padding: 4px 10px; }
  .big-emoji { font-size: clamp(34px, 8dvh, 90px); flex-shrink: 0; }
  .question { font-size: clamp(21px, 3.4dvh, 30px); flex-shrink: 0; }
  .timer { font-size: 13px; padding: 2px 10px; min-width: 74px; }
  .stats { gap: 8px; }
  .stat { padding: 6px 10px; }
  .stat b { font-size: 22px; }
  .answers { flex: 1; min-height: 0; grid-template-rows: 1fr 1fr; gap: 10px; }
  .ans { min-height: 0; padding: 6px; gap: 4px; font-size: clamp(16px, 2.5dvh, 22px); border-radius: 16px; box-shadow: 0 4px 0 var(--jungle); }
  .ans .e { font-size: clamp(26px, 5.5dvh, 48px); }
  .ans.num .n { font-size: clamp(36px, 7dvh, 60px); }
  .ans.right { box-shadow: 0 4px 0 var(--good); }
  .ans.wrong { box-shadow: 0 4px 0 var(--bad); }
  /* after answering, the big picture makes room for a one-line feedback bar */
  .card.answered .big-emoji { display: none; }
  #fb { flex-shrink: 0; }
  .feedback { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 6px 12px; padding: 8px 10px; font-size: 17px; border-radius: 14px; }
  .feedback .pts { font-size: 22px; }
  .fact { font-size: 14px; padding: 5px 8px; line-height: 1.35; }
  /* after answering: keep only the chosen and the correct answer, as one compact row, so the explanation fits */
  .card.answered .ans.dim { display: none; }
  .card.answered .answers { flex: 0 0 auto; grid-template-rows: auto; grid-auto-rows: auto; }
  .card.answered .ans { flex-direction: row; gap: 6px; padding: 8px 6px; min-height: 0; }
  .card.answered .ans .e { font-size: 26px; }
  .card.answered .ans.num .n { font-size: 30px; }
  .card.answered #fb { flex: 1; display: flex; align-items: center; }
  .card.answered .feedback { width: 100%; box-sizing: border-box; }
  /* win screen fits one phone screen */
  .win { justify-content: safe center; gap: clamp(6px, 1.2dvh, 14px); }
  .trophy { font-size: clamp(34px, 7dvh, 90px); }
  .win h2 { font-size: clamp(22px, 3.6dvh, 34px); }
  .win p { font-size: 15px; }
  .stats { gap: 6px; }
  .stat { padding: 4px 8px; }
  .stat b { font-size: 19px; }
  .stat .sl { font-size: 13px; }
  .stat.time b { font-size: 17px; }
  .stat .sq { font-size: 11px; }
  .win-btns { flex-wrap: nowrap; gap: 8px; }
  .win-btns .btn { font-size: 18px; padding: 4px 16px; box-shadow: 0 3px 0 var(--jungle); }
  .feedback .btn { font-size: 19px; padding: 4px 20px; box-shadow: 0 3px 0 var(--jungle); }

  .pick-title { font-size: clamp(20px, 3.2dvh, 28px); flex-shrink: 0; }
  .pick-sub { font-size: 14px; margin-top: -6px; flex-shrink: 0; }
  .repeat-opt { flex-shrink: 0; gap: 2px; }
  .repeat-opt label { font-size: 14px; }
  .repeat-opt input { width: 20px; height: 20px; }
  .seen-info { font-size: 12px; }
  .topics { flex: 1; min-height: 0; grid-template-rows: repeat(4, minmax(0, 1fr)) auto; gap: 8px; }
  .topic .tn { line-height: 1.1; text-wrap: balance; }
  .topic.all { padding-block: 8px; }
  .topic { min-height: 0; padding: 4px; gap: 2px; justify-content: center; border-radius: 16px; box-shadow: 0 4px 0 var(--jungle); }
  .topic .ti { font-size: clamp(26px, 5dvh, 52px); }
  .topic .tn { font-size: clamp(15px, 2.3dvh, 22px); }
  .topic .tc { font-size: 12px; }
  .topic:not(.all) .tc { display: none; }
  .topic.all .tc { display: none; }
  .topic.all { padding-block: 4px; }
  .topic.all .ti { font-size: clamp(22px, 3.6dvh, 36px); }
  .topic.all .ti { font-size: clamp(24px, 4dvh, 40px); }

  .win { justify-content: center; }
  .trophy { font-size: clamp(50px, 9dvh, 110px); }
  .win { gap: clamp(8px, 1.6dvh, 18px); }
  .win p { font-size: 17px; }
  .records { padding: 6px 10px; gap: 2px; }
  .rec-title, .rec-row { font-size: 14px; }
  .rec-row b { font-size: 17px; }
  .win h2 { font-size: clamp(26px, 4dvh, 38px); }
}
</style>

</head>
<body>
<div class="wrap" dir="rtl" lang="he">
  <header>
    <h1>הטריוויה הגדולה</h1>
    <div class="score" id="score" aria-live="polite">0 <small>נק׳</small></div>
  </header>

  <div>
    <div class="trail" aria-hidden="true">
      <div class="track"></div>
      <div class="fill" id="fill"></div>
      <div class="goal">🏆</div>
      <div class="runner" id="runner">🐆</div>
    </div>
    <div class="trail-label"><span>התחלה</span><span>100 נקודות = ניצחון!</span></div>
  </div>

  <main class="card" id="card"></main>
</div>
<canvas id="confetti"></canvas>

<script>
const GOAL = 100, STEP = 5;

/* Each line: picture | question | correct answer | wrong | wrong | wrong
   Each answer ends with its emoji after the last space. Answers get shuffled on screen. */
const TOPICS = [
{ id:"animals", name:"חיות", icon:"🦁", runner:"🐆", data:`
🐄|איזו חיה אומרת ״מוּ״?|פרה 🐄|כבשה 🐑|חזיר 🐷|ברווז 🦆|הפרה אומרת ״מוּ״, הכבשה אומרת ״מֶה״ והחזיר אומר ״אוֹינְק״.
🦒|מי החיה הכי גבוהה בעולם?|ג׳ירפה 🦒|פיל 🐘|סוס 🐎|גמל 🐪|הצוואר של הג׳ירפה ארוך כל כך, שהיא יכולה להציץ לחלון בקומה השנייה!
🐼|מה הפנדה הכי אוהבת לאכול?|במבוק 🎋|דגים 🐟|גבינה 🧀|בננות 🍌|פנדה אוכלת במבוק כמעט כל היום, יותר מחצי יום בכל יום.
🕷️|כמה רגליים יש לעכביש?|8 8️⃣|6 6️⃣|4 4️⃣|10 🔟|לעכביש יש 8 רגליים, ולכן הוא לא חרק. לחרקים יש 6.
🐜|כמה רגליים יש לנמלה?|6 6️⃣|8 8️⃣|4 4️⃣|2 2️⃣|לכל החרקים יש 6 רגליים, וגם לנמלה.
🏠|איזו חיה סוחבת את הבית שלה על הגב?|צב 🐢|ארנב 🐇|שועל 🦊|סוס 🐎|לצב יש שריון קשה שמחובר לגוף שלו, והוא הבית שלו לכל החיים.
🐶|איך קוראים לתינוק של כלב?|גוּר 🍼|אפרוח 🍼|עגל 🍼|טלה 🍼|תינוק של כלב נקרא גוּר. גם התינוקות של אריה, דוב וחתול נקראים גורים.
🌊|מי בעל החיים הכי גדול בעולם?|לווייתן כחול 🐋|פיל 🐘|ג׳ירפה 🦒|כריש 🦈|הלווייתן הכחול הוא בעל החיים הכי גדול שחי אי פעם, גדול יותר מכל דינוזאור!
🐟|במה דגים נושמים מתחת למים?|בזימים 🫧|באף 👃|באוזניים 👂|בסנפירים 🌊|לדגים יש זימים בצדי הראש, והם מוציאים מהמים את החמצן שהם צריכים.

// parse the question lines
TOPICS.forEach(t => {
  t.qs = t.data.trim().split("\n").map(line => {
    const p = line.split("|").map(s => s.trim());
    const ans = p.slice(2, 6).map(s => { const k = s.lastIndexOf(" "); return { t: s.slice(0, k), e: s.slice(k + 1) }; });
    return { e: p[0], q: p[1], a: ans, fact: p[6] || "", topic: t };
  });
});
const ALL = { id:"all", name:"הכל מעורבב", icon:"🎲", runner:"🐆", qs: TOPICS.flatMap(t => t.qs) };

const card = document.getElementById("card");
const scoreEl = document.getElementById("score");
const fill = document.getElementById("fill");

let score = 0, right = 0, wrong = 0, deck = [], current = null, topic = null;

/* --- per-question stopwatch --- */
function fmtTime(sec) {
  if (sec < 60) return `${sec.toFixed(2)} שניות`;
  const m = Math.floor(sec / 60), s = (sec % 60).toFixed(2);
  return `${m}:${s.padStart(5, "0")} דקות`;
}
function startTimer() {
  stopTimer();
  qStart = performance.now();
  const el = document.getElementById("timer");
  tick = setInterval(() => { if (el) el.textContent = `⏱️ ${((performance.now() - qStart) / 1000).toFixed(2)}`; }, 31);
}
function stopTimer() { if (tick) { clearInterval(tick); tick = null; } }

function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
/* --- "don't repeat questions from earlier games" (remembered on this device) --- */
const STORE_OPT = "trivia.noRepeat", STORE_SEEN = "trivia.seen";
function loadOpt() { try { const v = localStorage.getItem(STORE_OPT); return v === null ? true : v === "1"; } catch (e) { return true; } }
function saveOpt(v) { try { localStorage.setItem(STORE_OPT, v ? "1" : "0"); } catch (e) {} }
let noRepeat = loadOpt();
let seen = new Set();
try { seen = new Set(JSON.parse(localStorage.getItem(STORE_SEEN) || "[]")); } catch (e) {}
function saveSeen() { try { localStorage.setItem(STORE_SEEN, JSON.stringify([...seen])); } catch (e) {} }
function markSeen(q) { if (!seen.has(q)) { seen.add(q); saveSeen(); } }
function freshCount(t) { return t.qs.filter(q => !seen.has(q.q)).length; }

// questions are taken from the end of the deck, so new ones go last
function buildDeck() {
  const all = shuffle(topic.qs);
  if (!noRepeat) return all;
  let fresh = all.filter(q => !seen.has(q.q));
  if (!fresh.length) {               // he has seen every question here: start this topic over
    topic.qs.forEach(q => seen.delete(q.q)); saveSeen();
    return all;
  }
  return all.filter(q => seen.has(q.q)).concat(fresh);
}
function nextFromDeck() { if (!deck.length) deck = buildDeck(); return deck.pop(); }

/* --- sound (starts only after a tap) --- */
let ctx = null;
function tone(freqs, dur = .12, type = "triangle") {
  try {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.value = f;
      const t = ctx.currentTime + i * dur;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.25, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + dur + .02);
    });
  } catch (e) {}
}

/* --- read aloud --- */
function speak(text) {
  try {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "he-IL"; u.rate = .9;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith("he"));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function hush() { try { speechSynthesis.cancel(); } catch (e) {} }

function updateScore(bump) {
  scoreEl.innerHTML = `${score} <small>נק׳</small>`;
  const pct = Math.min(score, GOAL) / GOAL * 100;
  fill.style.width = pct + "%";
  runner.style.right = `calc(${pct}% - ${pct * .38}px)`;
  if (bump) { scoreEl.classList.remove("bump"); void scoreEl.offsetWidth; scoreEl.classList.add("bump"); setTimeout(() => scoreEl.classList.remove("bump"), 220); }
}

function showMenu() {

  runner.textContent = "🐆";

    <div class="topics">
      ${TOPICS.map(t => `<button class="topic" type="button" id="topic-${t.id}" data-id="${t.id}"><span class="ti" aria-hidden="true">${t.icon}</span><span class="tn">${t.name}</span><span class="tc">${t.qs.length} שאלות</span></button>`).join("")}
      <button class="topic all" type="button" id="topic-all" data-id="all"><span class="ti" aria-hidden="true">${ALL.icon}</span><span><span class="tn">${ALL.name}</span><br><span class="tc">${ALL.qs.length} שאלות מכל הנושאים</span></span></button>
    </div>

      <span class="seen-info" id="seen-info"></span>
    </div>`;
  card.querySelectorAll(".topic").forEach(b => b.onclick = () => startTopic(b.dataset.id));
  const box = document.getElementById("no-repeat");
  box.onchange = () => { noRepeat = box.checked; saveOpt(noRepeat); renderSeenInfo(); };
  renderSeenInfo();

function renderSeenInfo() {
  const el = document.getElementById("seen-info");
  if (!el) return;
  const n = ALL.qs.filter(q => seen.has(q.q)).length;
  if (!noRepeat || !n) { el.innerHTML = ""; return; }
  el.innerHTML = `${n} מתוך ${ALL.qs.length} שאלות כבר הופיעו · <button type="button" class="link-btn" id="reset-seen">להתחיל מחדש</button>`;
  document.getElementById("reset-seen").onclick = () => { seen = new Set(); saveSeen(); renderSeenInfo(); };
}

function startTopic(id) {
  topic = id === "all" ? ALL : TOPICS.find(t => t.id === id);
  score = 0; right = 0; wrong = 0; times = []; deck = buildDeck();
  runner.textContent = topic.runner;
  updateScore(false);
  tone([440, 554], .1);
  showQuestion();
}

// "How many…? 🌸🌸🌸" questions: keep the pictures together on their own line
function qHtml(q) {
  const k = q.indexOf("? ");
  if (k === -1) return q;
  return `${q.slice(0, k + 1)}<span class="count-row" dir="ltr">${q.slice(k + 2)}</span>`;
}

function showQuestion() {
  current = nextFromDeck();
  const opts = shuffle(current.a.map((x, i) => ({ t: x.t, e: x.e, ok: i === 0 })));
  const tag = topic.id === "all" ? `${current.topic.icon} ${current.topic.name}` : `${topic.icon} ${topic.name}`;
  card.className = "card";
  card.innerHTML = `
    <div class="q-top">
      <span><span class="topic-tag">${tag}</span> · שאלה ${right + wrong + 1}</span>
      <span class="timer" id="timer" aria-label="זמן לשאלה">⏱️ 0.00</span>
      <span class="q-tools">
        <button class="chip" id="speak" type="button">🔊 תקריאו לי</button>
        <button class="chip" id="menu" type="button">🔙 נושא אחר</button>
      </span>
    </div>
    <h2 class="question">${qHtml(current.q)}</h2>
    <div class="answers">${opts.map((o, i) => /^\d+$/.test(o.t)
      ? `<button class="ans num" type="button" id="ans${i}" data-i="${i}"><span class="n">${o.t}</span></button>`
      : `<button class="ans" type="button" id="ans${i}" data-i="${i}"><span class="e" aria-hidden="true">${o.e}</span><span class="t">${o.t}</span></button>`).join("")}</div>
    <div id="fb"></div>`;
  document.getElementById("speak").onclick = () => speak(current.q + " " + opts.map(o => o.t).join(", או "));
  document.getElementById("menu").onclick = showMenu;
  card.querySelectorAll(".ans").forEach(btn => btn.onclick = () => answer(opts, +btn.dataset.i));
  startTimer();
}

function answer(opts, i) {
  const btns = card.querySelectorAll(".ans");
  btns.forEach(b => b.disabled = true);
  stopTimer();
  const took = (performance.now() - qStart) / 1000;
  times.push({ sec: took, q: current.q });
  markSeen(current.q);
  const timerEl = document.getElementById("timer");
  if (timerEl) { timerEl.textContent = `⏱️ ${took.toFixed(2)}`; timerEl.classList.add("stopped"); }
  card.classList.add("answered");
  const okIdx = opts.findIndex(o => o.ok);
  const fb = document.getElementById("fb");
  if (opts[i].ok) {
    right++; score += STEP;
    btns[i].classList.add("right");
    btns.forEach((b, k) => { if (k !== i) b.classList.add("dim"); });
    tone([523, 659, 784]);
    const cheers = ["כל הכבוד!", "מעולה!", "יופי של תשובה!", "אלוף!", "וואו, נכון!", "מדהים!", "בול!"];
    fb.innerHTML = `<div class="feedback good"><span class="pts">+5 ⭐</span><span>${cheers[Math.floor(Math.random() * cheers.length)]}</span><button class="btn" id="next" type="button">${score >= GOAL ? "לגביע! 🏆" : "לשאלה הבאה ←"}</button></div>`;
  } else {
    wrong++; score = Math.max(0, score - STEP);
    btns[i].classList.add("wrong");
    btns[okIdx].classList.add("right");
    btns.forEach((b, k) => { if (k !== i && k !== okIdx) b.classList.add("dim"); });
    tone([330, 247], .18, "sine");
    fb.innerHTML = `<div class="feedback bad"><span class="pts">‎-5</span><span>אופס! התשובה הנכונה: ${opts[okIdx].e} ${opts[okIdx].t}</span>${current.fact ? `<span class="fact"><b>💡 הידעת?</b> ${current.fact}</span>` : ""}<button class="btn" id="next" type="button">לשאלה הבאה ←</button></div>`;
  }
  updateScore(true);
  const next = document.getElementById("next");
  next.focus({ preventScroll: true });
  next.onclick = () => { hush(); score >= GOAL ? showWin() : showQuestion(); };
}

/* --- personal records per topic (remembered on this device) --- */
const STORE_REC = "trivia.records";
function loadRecords() { try { return JSON.parse(localStorage.getItem(STORE_REC) || "{}") || {}; } catch (e) { return {}; } }
function saveRecords(r) { try { localStorage.setItem(STORE_REC, JSON.stringify(r)); } catch (e) {} }
function fmtTotal(sec) {
  const m = Math.floor(sec / 60), s = (sec % 60).toFixed(2);
  return m ? `${m}:${s.padStart(5, "0")} דקות` : `${s} שניות`;
}

function showWin() {
  stopTimer();
  const sorted = times.slice().sort((a, b) => a.sec - b.sec);
  const fast = sorted[0], slow = sorted[sorted.length - 1];
  const asked = right + wrong;
  const total = times.reduce((t, x) => t + x.sec, 0);
  const recs = loadRecords();
  const old = recs[topic.id] || null;
  const newFewest = !old || asked < old.fewest;
  const newFastest = !old || total < old.fastest;
  const rec = {
    fewest: old ? Math.min(old.fewest, asked) : asked,
    fastest: old ? Math.min(old.fastest, total) : total,
    wins: (old ? old.wins : 0) + 1
  };
  recs[topic.id] = rec; saveRecords(recs);
  const badge = `<span class="new-rec">שיא חדש!</span>`;
  const recHtml = `
    <div class="records">
      <div class="rec-title">🏅 השיאים שלך ב${topic.id === "all" ? "״הכל מעורבב״" : topic.name} · ניצחון מספר ${rec.wins}</div>
      <div class="rec-row"><span>הכי מעט שאלות עד 100:</span><b>${rec.fewest}</b>${old && newFewest ? badge : ""}</div>
      <div class="rec-row"><span>הניצחון הכי מהיר:</span><b>${fmtTotal(rec.fastest)}</b>${old && newFastest ? badge : ""}</div>
      ${old ? "" : `<div class="rec-first">זה הניצחון הראשון שלך בנושא הזה, אז אלה השיאים שצריך לשבור!</div>`}
      ${old && !newFastest ? `<div class="rec-first">הפעם: ${fmtTotal(total)}</div>` : ""}
    </div>`;
  card.className = "card win";
  card.innerHTML = `
    <div class="trophy" aria-hidden="true">🏆</div>
    <h2>ניצחת! 100 נקודות!</h2>
    <p>אתה אלוף ב${topic.id === "all" ? "כל הנושאים" : topic.name} ${topic.icon}</p>
    <div class="stats">
      <div class="stat"><b>${right}</b>תשובות נכונות</div>
      <div class="stat"><b>${wrong}</b>טעויות</div>
      <div class="stat time fast"><span class="sl">⚡ השאלה הכי מהירה</span><b>${fmtTime(fast.sec)}</b><span class="sq">${fast.q}</span></div>
      <div class="stat time slow"><span class="sl">🐢 השאלה הכי ארוכה</span><b>${fmtTime(slow.sec)}</b><span class="sq">${slow.q}</span></div>
    </div>
    ${recHtml}
    <div class="win-btns">
      <button class="btn" id="again" type="button">עוד פעם 🔄</button>
      <button class="btn alt" id="other" type="button">נושא אחר 🎯</button>
    </div>`;
  tone([523, 659, 784, 1047, 784, 1047], .14);
  confetti();
  document.getElementById("again").onclick = () => startTopic(topic.id);
  document.getElementById("other").onclick = showMenu;
}

/* --- confetti --- */
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.getElementById("confetti"), c = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ["#FFC93C", "#149463", "#E2502F", "#3A86FF", "#FF7AB6"];
  const bits = Array.from({ length: 160 }, () => ({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height, r: 5 + Math.random() * 6, vy: 2 + Math.random() * 3, vx: -1 + Math.random() * 2, a: Math.random() * 6, c: colors[Math.floor(Math.random() * colors.length)] }));
  let frames = 0;
  (function loop() {
    c.clearRect(0, 0, cv.width, cv.height);
    bits.forEach(b => { b.y += b.vy; b.x += b.vx; b.a += .1; c.fillStyle = b.c; c.save(); c.translate(b.x, b.y); c.rotate(b.a); c.fillRect(-b.r / 2, -b.r / 2, b.r, b.r * .6); c.restore(); });
    if (++frames < 260) requestAnimationFrame(loop); else c.clearRect(0, 0, cv.width, cv.height);
  })();
}

showMenu();
</script>
